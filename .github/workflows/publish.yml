name: publish

# Publishes to npm through Trusted Publishing (OIDC): npm verifies this
# workflow's identity, so no long-lived NPM_TOKEN is stored in the repository.
#
# A real publish requires a tag. `workflow_dispatch` exists for dry runs and for
# re-running a release that already has a tag; it can never publish a branch
# head, even if package.json has moved ahead of the last release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_confirm:
        description: 'Type "publish" to actually publish. Ignored unless the selected ref is a tag.'
        required: false
        default: ''

permissions:
  contents: write # required to create the GitHub Release for each tag
  id-token: write # required to mint the OIDC token npm exchanges for publish rights

jobs:
  publish:
    # Flip the repository variable PUBLISH_ENABLED to "true" to arm this job.
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `registry-url`: that writes an .npmrc with an empty _authToken,
          # which interferes with the OIDC exchange. npm defaults to the public
          # registry anyway.

      # Trusted Publishing needs npm >= 11.5; Node 22 still ships npm 10.x.
      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@latest && npm --version

      # No dependencies, so nothing to install; the tests use Node built-ins.
      - name: Test
        run: npm test

      - name: A branch ref only tests, it never publishes
        if: github.ref_type != 'tag'
        run: |
          echo "::notice::ref ${GITHUB_REF_NAME} is a branch, so this run only tests. Publishing requires a v* tag."
          {
            echo "### Dry run"
            echo ""
            echo "Ref \`${GITHUB_REF_NAME}\` is a branch. Nothing was published."
            echo "Push a \`v*\` tag to release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (`v${version}` !== tag) {
              console.error(`tag ${tag} does not match package.json ${version}`);
              process.exit(1);
            }
            console.log(`publishing ${version} for tag ${tag}`);
          '

      - name: Version must not already exist on npm
        id: guard
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-session-matrix@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-session-matrix@${version} is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${version} is available"
          fi

      # A tag push is a release intent, so republishing an existing version there
      # is a real mistake and must fail loudly.
      - name: Refuse to republish an existing version on a tag
        if: steps.guard.outputs.exists == 'true' && github.ref_type == 'tag'
        run: |
          echo "refusing: this version is already on npm"
          exit 1

      # Publishing requires all of: a tag ref, a version npm does not have, and a
      # tag push or an explicit confirmation on a manual run of that tag.
      - name: Publish
        if: |
          github.ref_type == 'tag' &&
          steps.guard.outputs.exists == 'false' &&
          (github.event_name == 'push' || inputs.publish_confirm == 'publish')
        run: npm publish --provenance --access public

      # The Release is part of the release: a tag must never leave the
      # repository's Releases page stale. Idempotent — an existing Release is
      # left untouched instead of failing the run.
      #
      # Notes come from the CHANGELOG section for this version, not from
      # --generate-notes: a single-author commit history can produce an empty
      # auto body, and the changelog is the text we actually write for users.
      - name: Create GitHub Release
        if: |
          github.ref_type == 'tag' &&
          steps.guard.outputs.exists == 'false' &&
          (github.event_name == 'push' || inputs.publish_confirm == 'publish')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it as is"
            exit 0
          fi
          node - <<'NODE' > "$RUNNER_TEMP/release-notes.md"
          const fs = require('node:fs')
          const version = require('./package.json').version
          const text = fs.readFileSync('CHANGELOG.md', 'utf8')
          const escaped = version.replace(/\./g, '\\.')
          const pattern = new RegExp('## \\[' + escaped + '\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)')
          const match = text.match(pattern)
          const body = match ? match[1].trim() : ''
          if (body) process.stdout.write(body + '\n')
          else {
            const url = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/blob/main/CHANGELOG.md'
            process.stdout.write('See [CHANGELOG.md](' + url + ').\n')
          }
          NODE
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
